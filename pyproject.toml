[project]
name = "local-transcribe"
version = "0.1.0"
description = "Local speech-to-text with speaker labels for long, messy recordings: WhisperX, gap filling, junk filtering, mixed-language repair."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ASR + word alignment + diarization (pins torch~=2.8.0 on its own).
    "whisperx>=3.8.6",
    # Pinned as a family: on Windows and Linux they come from the CUDA index (see [tool.uv]),
    # on macOS from PyPI. whisperx needs torchvision, so it is pinned with the rest.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    # HF_TOKEN from .env for diarization; never committed.
    "python-dotenv>=1.0",
    "numpy>=2.1",
]

[project.scripts]
local-transcribe = "local_transcribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcribe"]

[tool.uv]
# Only the torch family is resolved against the CUDA index, and only where CUDA exists.
# The CUDA builds run on a machine without a GPU too: the code then picks the CPU by itself.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the real models (downloads them on first use); skipped unless --run-slow is given",
]
addopts = "-ra"
